name: Build and deploy Energomapa
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Playwright 1.58.2 ships Chromium dependencies for this supported image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: Build data
        run: python pipeline/build.py
      - name: Test data engine
        run: npm test
      - name: Test source adapters
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify deterministic offline data
        run: python pipeline/check_determinism.py
      - name: Package static site
        run: python pipeline/package.py
      - name: Install test browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Test Eurostat exports, contrast, mobile and isolated offline scopes
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-browser-evidence
          path: artifacts/remediation
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
